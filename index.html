<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Ranking - Árbitros del Estado Sucre</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            sucre: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#035388',
              800: '#075985',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-between">

  <!-- NOTIFICATION CONTAINER -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm w-full"></div>

  <!-- HEADER / NAVBAR -->
  <header class="bg-gradient-to-r from-sucre-900 via-sucre-800 to-sucre-700 text-white shadow-lg sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
      <div class="flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-3">
          <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-sucre-800 font-black text-xl shadow-md border-2 border-amber-400">
            <i class="fa-solid fa-shield-halved text-amber-500 text-2xl"></i>
          </div>
          <div>
            <h1 class="font-extrabold text-xl sm:text-2xl tracking-tight leading-none text-white">
              ÁRBITROS DE SUCRE
            </h1>
            <p class="text-xs text-blue-200 font-medium tracking-wide">
              Sistema de Evaluación & Ranking Físico
            </p>
          </div>
        </div>

        <!-- AUTH BUTTONS -->
        <div class="flex items-center space-x-3">
          <div id="user-status-badge" class="hidden sm:flex items-center gap-2 bg-sucre-900/60 text-xs px-3 py-1.5 rounded-full border border-sucre-600">
            <span id="auth-indicator" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
            <span id="auth-status-text">Modo Lectura</span>
          </div>

          <button id="btn-login-modal" onclick="openLoginModal()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold px-4 py-2 rounded-lg text-sm transition shadow-md flex items-center gap-2">
            <i class="fa-solid fa-lock"></i>
            <span>Acceso Admin</span>
          </button>

          <button id="btn-logout" onclick="handleLogout()" class="hidden bg-rose-600 hover:bg-rose-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition shadow-md flex items-center gap-2">
            <i class="fa-solid fa-right-from-bracket"></i>
            <span>Cerrar Sesión</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

    <!-- ADMIN CONTROLS BANNER (VISIBLE ONLY TO ADMIN) -->
    <div id="admin-banner" class="hidden mb-8 bg-amber-50 border-l-4 border-amber-500 p-4 rounded-r-xl shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-user-gear text-amber-600 text-2xl"></i>
          <div>
            <h3 class="font-bold text-amber-900">Modo Administrador Activo</h3>
            <p class="text-xs text-amber-700">Tienes permisos para gestionar semanas, añadir árbitros y cargar resultados de pruebas.</p>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">
          <button onclick="openModal('modal-add-referee')" class="bg-sucre-700 hover:bg-sucre-800 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-user-plus"></i>
            <span>Nuevo Árbitro</span>
          </button>
          <button onclick="openModal('modal-add-week')" class="bg-sucre-700 hover:bg-sucre-800 text-white text-xs font-semibold px-3 py-2 rounded-lg shadow transition flex items-center gap-1.5">
            <i class="fa-solid fa-calendar-plus"></i>
            <span>Nueva Semana</span>
          </button>
        </div>
      </div>
    </div>

    <!-- TABS NAVIGATION -->
    <div class="flex border-b border-slate-200 mb-6 space-x-2 overflow-x-auto pb-1">
      <button id="tab-btn-ranking" onclick="switchTab('ranking')" class="tab-active py-2.5 px-5 font-semibold text-sm rounded-t-lg transition flex items-center gap-2 border-b-2 border-sucre-600 text-sucre-700 bg-sucre-50/50">
        <i class="fa-solid fa-trophy text-amber-500"></i>
        <span>Ranking Semanal</span>
      </button>
      <button id="tab-btn-weeks" onclick="switchTab('weeks')" class="tab-inactive py-2.5 px-5 font-semibold text-sm rounded-t-lg transition flex items-center gap-2 border-b-2 text-slate-500 border-transparent hover:text-sucre-600">
        <i class="fa-solid fa-stopwatch text-sucre-600"></i>
        <span>Pruebas por Semana</span>
      </button>
      <button id="tab-btn-referees" onclick="switchTab('referees')" class="tab-inactive py-2.5 px-5 font-semibold text-sm rounded-t-lg transition flex items-center gap-2 border-b-2 text-slate-500 border-transparent hover:text-sucre-600">
        <i class="fa-solid fa-users text-slate-600"></i>
        <span>Nómina de Árbitros</span>
      </button>
    </div>

    <!-- TAB 1: RANKING SEMANAL -->
    <section id="tab-content-ranking" class="tab-content">
      <div class="bg-white rounded-2xl shadow-md border border-slate-100 overflow-hidden space-y-4 p-5">
        
        <!-- CONTROLES DEL RANKING: SELECTOR DE SEMANA Y FILTRO DE CATEGORÍA -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-100 pb-4">
          <div>
            <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
              <i class="fa-solid fa-medal text-amber-500"></i>
              Clasificación Semanal
            </h2>
            <p class="text-xs text-slate-500">Promedio de las notas individuales (Base 10) de cada prueba de la semana</p>
          </div>

          <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
